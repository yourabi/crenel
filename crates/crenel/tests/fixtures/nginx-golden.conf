# PINNED nginx reference configuration for the golden-fixture harness (the
# claim row cites this exact config). Placeholders {{PREFIX}}/{{PORT}}/{{ROOT}} are
# substituted by tests/nginx_golden.rs into a temp prefix at run time.
#
# Deliberate choices:
# - gzip_static on          -> sidecar comparison surface
# - sendfile on             -> the tuned-nginx posture the perf claim names
# - etag on (default)       -> validator comparison (ledger D1: format differs)
# - autoindex off (default) -> dir-without-index is 403 here (ledger D6: crenel misses)
# - types{} pinned to match crenel's table for the extensions the fixtures use, so
#   Content-Type comparisons test SEMANTICS, not distro mime.types drift.

pid {{PREFIX}}/nginx.pid;
error_log {{PREFIX}}/error.log warn;
worker_processes 1;

events {
    worker_connections 64;
}

http {
    access_log off;
    client_body_temp_path {{PREFIX}}/body_temp;
    proxy_temp_path {{PREFIX}}/proxy_temp;
    fastcgi_temp_path {{PREFIX}}/fastcgi_temp;
    uwsgi_temp_path {{PREFIX}}/uwsgi_temp;
    scgi_temp_path {{PREFIX}}/scgi_temp;

    default_type application/octet-stream;
    types {
        text/html                 html;
        text/css                  css;
        text/javascript           js;
        text/plain                txt;
        image/png                 png;
        application/gzip          gz;
    }

    sendfile on;
    gzip_static on;

    server {
        listen 127.0.0.1:{{PORT}};
        server_name localhost;
        root {{ROOT}};
    }
}
