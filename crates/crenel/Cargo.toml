[package]
name = "crenel"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Framework-agnostic static-file-serving engine: decode-once path classification and kernel-scoped (openat2 / O_RESOLVE_BENEATH) contained resolution"

[lints.rust]
# cargo-fuzz builds with --cfg fuzzing; declare it so the fuzz-only exports lint clean.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[dependencies]
# RFC 9110 §5.6.7 HTTP-date parsing (all three formats) and IMF-fixdate formatting.
httpdate = "1"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { workspace = true }
arc-swap = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The nginx golden harness formats probe dates itself.
httpdate = "1"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
# Async runtime features used by workspace test builds.
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "fs"] }
# Resolver tests create FIFOs and inspect fds directly.
rustix = { workspace = true }
